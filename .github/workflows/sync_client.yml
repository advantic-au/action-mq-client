name: MQ Client Sync

on:
  workflow_dispatch:
  schedule: [cron: "40 4 * * *" ]

permissions: {}

jobs:
  sync_client:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          ref: client_sync
      - uses: qoomon/actions--setup-git@25cea6157f813f8e2793ef755b5e99f8648bb599
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync-client.py checksums.txt
      - name: Create pull request
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --stat --exit-code || {
            git commit -am 'client: Sync MQ client list'
            git push
          }
          gh pr create --base main --title "Client Sync ${{ github.run_id }}" --body "Synchronise with latest MQ libraries" || true
